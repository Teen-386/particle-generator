<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minecraft Bedrock パーティクル作成ツール</title>
  <style>
    :root {
      --bg-color: #1e1e1e;
      --panel-bg: #252526;
      --border-color: #3c3c3c;
      --text-color: #d4d4d4;
      --accent-color: #3a8ee6;
      --green-btn: #2ea043;
      --purple-btn: #8957e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      background-color: #181818;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
    }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #121212;
      position: relative;
      order: 2;
    }

    .preview-header {
      padding: 6px 12px;
      background-color: rgba(30, 30, 30, 0.85);
      font-size: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    #previewCanvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
    }

    .mobile-tabs {
      display: none;
      background-color: #181818;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      background: none;
      border: none;
      color: #888;
      font-size: 0.85rem;
      font-weight: bold;
      border-bottom: 3px solid transparent;
    }

    .tab-btn.active {
      color: #ffffff;
      border-bottom-color: var(--accent-color);
      background-color: var(--panel-bg);
    }

    .controls-panel {
      width: 360px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      padding: 16px;
      overflow-y: auto;
      order: 1;
    }

    .output-panel {
      width: 380px;
      background-color: var(--panel-bg);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 16px;
      order: 3;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #9cdcfe;
      margin-top: 18px;
      margin-bottom: 10px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
    }

    .section-title:first-child {
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 8px 10px;
      background-color: #3c3c3c;
      border: 1px solid #555;
      color: #fff;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    input[type="file"] {
      width: 100%;
      padding: 6px;
      background-color: #3c3c3c;
      border: 1px solid #555;
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    input[type="range"] {
      width: 100%;
      height: 28px;
      cursor: pointer;
    }

    input[type="color"] {
      width: 100%;
      height: 38px;
      border: none;
      background: none;
      cursor: pointer;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row .form-group {
      flex: 1;
    }

    .pixel-editor-box {
      background-color: #1a1a1a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .pixel-canvas-wrapper {
      display: flex;
      justify-content: center;
      margin: 10px 0;
    }

    #pixelCanvas {
      width: 224px;
      height: 224px;
      background-image:
        linear-gradient(45deg, #2b2b2b 25%, transparent 25%),
        linear-gradient(-45deg, #2b2b2b 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #2b2b2b 75%),
        linear-gradient(-45deg, transparent 75%, #2b2b2b 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-color: #1f1f1f;
      border: 1px solid #666;
      image-rendering: pixelated;
      touch-action: none;
      cursor: crosshair;
    }

    .tool-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .tool-btn {
      flex: 1;
      min-width: 54px;
      padding: 6px 4px;
      background-color: #3c3c3c;
      border: 1px solid #555;
      color: #fff;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .tool-btn.active {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      font-weight: bold;
    }

    .frame-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
      background-color: #252526;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #444;
    }

    .frame-btn {
      padding: 4px 8px;
      background-color: #3c3c3c;
      border: 1px solid #555;
      color: #fff;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .output-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    button.action-btn,
    label.action-btn {
      padding: 10px 10px;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.82rem;
      flex: 1;
      min-width: 95px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .btn-load {
      background-color: var(--purple-btn);
      position: relative;
      overflow: hidden;
    }

    .btn-load input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .btn-copy {
      background-color: var(--accent-color);
    }

    .btn-download {
      background-color: var(--green-btn);
    }

    textarea {
      flex: 1;
      width: 100%;
      background-color: #1e1e1e;
      color: #ce9178;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.8rem;
      resize: none;
      line-height: 1.4;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--green-btn);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }

      .preview-panel {
        flex: none;
        height: 32dvh;
        order: 1;
      }

      .mobile-tabs {
        display: flex;
        order: 2;
      }

      .controls-panel,
      .output-panel {
        width: 100%;
        flex: 1;
        border: none;
        order: 3;
        display: none;
      }

      .controls-panel.active-tab {
        display: block;
      }

      .output-panel.active-tab {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Bedrock パーティクル作成ツール</h1>
    <span style="font-size: 0.75rem; color: #888;">v1.30.0</span>
  </header>

  <div class="main-container">
    <div class="preview-panel">
      <div class="preview-header">
        <span>リアルタイムプレビュー</span>
        <span id="particle-count">表示中: 0</span>
      </div>
      <canvas id="previewCanvas"></canvas>
    </div>

    <div class="mobile-tabs">
      <button class="tab-btn active" id="tab-btn-controls" onclick="switchTab('controls')">⚙️ 設定・お絵描き</button>
      <button class="tab-btn" id="tab-btn-output" onclick="switchTab('output')">📄 JSON出力・保存</button>
    </div>

    <div class="controls-panel active-tab" id="panel-controls">
      <div class="section-title">テクスチャ・イラスト設定</div>
      <div class="form-group">
        <label>テクスチャのモード</label>
        <select id="textureMode" onchange="changeTextureMode()">
          <option value="draw">✏️ カスタムお絵描き (アニメ対応)</option>
          <option value="import">📁 イラスト画像をそのまま使用</option>
          <option value="none">⬜ 単色スクエア (テクスチャなし)</option>
        </select>
      </div>

      <div id="mode-draw-box" class="pixel-editor-box">
        <div class="form-group" style="margin-bottom: 8px;">
          <label>1コマのキャンバス解像度</label>
          <select id="canvasResolution" onchange="changeResolution()">
            <option value="16" selected>16 × 16 (標準)</option>
            <option value="32">32 × 32 (高精細)</option>
            <option value="64">64 × 64 (HD)</option>
            <option value="128">128 × 128 (超高精細)</option>
          </select>
        </div>

        <div class="frame-bar">
          <button type="button" class="frame-btn" onclick="prevFrame()">◀</button>
          <span id="frame-label" style="font-size: 0.78rem; font-weight: bold; flex: 1; text-align: center;">コマ: 1 / 1</span>
          <button type="button" class="frame-btn" onclick="nextFrame()">▶</button>
          <button type="button" class="frame-btn" style="background: #2ea043;" onclick="addFrame()">＋複製</button>
          <button type="button" class="frame-btn" style="background: #b62324;" onclick="deleteFrame()">削除</button>
        </div>

        <div class="tool-bar">
          <button type="button" class="tool-btn active" id="tool-pen" onclick="setDrawTool('pen')">✏️ ペン</button>
          <button type="button" class="tool-btn" id="tool-fill" onclick="setDrawTool('fill')">🪣 塗り</button>
          <button type="button" class="tool-btn" id="tool-line" onclick="setDrawTool('line')">📏 ライン</button>
          <button type="button" class="tool-btn" id="tool-circle" onclick="setDrawTool('circle')">⭕ 円</button>
          <button type="button" class="tool-btn" id="tool-eraser" onclick="setDrawTool('eraser')">🧽 消す</button>
          <button type="button" class="tool-btn" onclick="clearPixelCanvas()">🗑️ 全消</button>
        </div>

        <div class="row" style="align-items: center;">
          <div class="form-group" style="margin-bottom: 0;">
            <label>描画色</label>
            <input type="color" id="drawColor" value="#ffffff">
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label>線の太さ: <span id="val-brushSize">1</span>px</label>
            <input type="range" id="brushSize" min="1" max="8" value="1" oninput="document.getElementById('val-brushSize').textContent=this.value">
          </div>
        </div>

        <div class="pixel-canvas-wrapper">
          <canvas id="pixelCanvas" width="16" height="16"></canvas>
        </div>

        <div class="row" style="gap: 8px;">
          <label class="action-btn btn-load">
            📂 画像を読込
            <input type="file" id="loadToCanvasInput" accept="image/*" onchange="loadImageToPixelCanvas(event)">
          </label>
          <button type="button" class="action-btn btn-download" onclick="downloadTexturePNG()">🖼️ .png保存</button>
        </div>
      </div>

      <div id="mode-import-box" class="pixel-editor-box" style="display: none;">
        <div class="form-group" style="margin-bottom: 8px;">
          <label>画像ファイルを選択 (PNG / JPG / GIF)</label>
          <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(event)">
        </div>
        <div class="form-group" style="margin-bottom: 4px;">
          <label>スプライトシートの縦コマ数 (1=静止画)</label>
          <input type="range" id="importFrames" min="1" max="32" value="1" oninput="updateImportFrames()">
          <span id="val-importFrames" style="font-size: 0.75rem; color: #9cdcfe;">1 コマ (静止画)</span>
        </div>
        <p id="imported-info" style="font-size: 0.75rem; color: #aaa;">※縦長スプライトシートを読み込んだ場合はコマ数を合わせてください</p>
      </div>

      <div class="section-title">基本設定 (Description)</div>
      <div class="form-group">
        <label>識別子 (Identifier)</label>
        <input type="text" id="identifier" value="custom:my_particle">
      </div>
      <div class="form-group">
        <label>テクスチャパス (リソースパック内)</label>
        <input type="text" id="texture" value="textures/particle/custom_particle">
      </div>
      <div class="form-group">
        <label>マテリアル</label>
        <select id="material">
          <option value="particles_alpha">particles_alpha (標準・透過)</option>
          <option value="particles_blend">particles_blend (半透明ブレンド)</option>
          <option value="particles_add">particles_add (加算・発光風)</option>
        </select>
      </div>

      <div class="section-title">放出設定 (Emitter)</div>
      <div class="form-group">
        <label>放出レート (個/秒) <span id="val-rate">20</span></label>
        <input type="range" id="rate" min="1" max="100" value="20">
      </div>
      <div class="form-group">
        <label>最大パーティクル数 <span id="val-max">100</span></label>
        <input type="range" id="maxParticles" min="10" max="500" step="10" value="100">
      </div>
      <div class="form-group">
        <label>放出範囲の広がり (半径) <span id="val-spread">0.5</span></label>
        <input type="range" id="spread" min="0" max="5" step="0.1" value="0.5">
      </div>

      <div class="section-title">寿命と動き (Lifetime & Motion)</div>
      <div class="form-group">
        <label>パーティクルの寿命 (秒) <span id="val-lifetime">1.5</span></label>
        <input type="range" id="lifetime" min="0.1" max="10" step="0.1" value="1.5">
      </div>
      <div class="form-group">
        <label>初速度 (Speed) <span id="val-speed">2.0</span></label>
        <input type="range" id="speed" min="0" max="15" step="0.5" value="2.0">
      </div>
      <div class="form-group">
        <label>重力 / Y軸加速度 <span id="val-gravity">-1.0</span></label>
        <input type="range" id="gravity" min="-10" max="10" step="0.5" value="-1.0">
      </div>

      <div class="section-title">見た目・色変化 (Appearance)</div>
      <div class="form-group">
        <label>サイズ (ブロック比率) <span id="val-size">0.25</span></label>
        <input type="range" id="size" min="0.05" max="1.5" step="0.05" value="0.25">
      </div>
      <div class="form-group">
        <label>色の適用モード</label>
        <select id="colorMode" onchange="toggleColorMode()">
          <option value="original" selected>🎨 そのままの色を使う (色変更なし)</option>
          <option value="tint">🌈 開始色 → 終了色に変化させる</option>
        </select>
      </div>
      <div class="row" id="tint-color-row" style="display: none;">
        <div class="form-group">
          <label>開始色 (乗算)</label>
          <input type="color" id="colorStart" value="#ffffff">
        </div>
        <div class="form-group">
          <label>終了色 (乗算)</label>
          <input type="color" id="colorEnd" value="#ffaa00">
        </div>
      </div>
      <div class="form-group">
        <label>フェードアウト (透明度変化)</label>
        <select id="fadeOut">
          <option value="true">あり (徐々に消える)</option>
          <option value="false">なし (くっきり消える)</option>
        </select>
      </div>
    </div>

    <div class="output-panel" id="panel-output">
      <div class="section-title" style="margin-top:0;">生成されたJSONコード</div>
      <div class="output-actions">
        <label class="action-btn btn-load">
          📂 .json読込
          <input type="file" id="loadJsonInput" onchange="loadParticleJSON(event)">
        </label>
        <button class="action-btn btn-copy" onclick="copyJSON()">📋 コピー</button>
        <button class="action-btn btn-download" onclick="downloadJSON()">💾 .json保存</button>
      </div>
      <textarea id="jsonOutput" readonly></textarea>
    </div>
  </div>

  <div id="toast" class="toast">完了しました！</div>
  <script>
    var texWidth = 16;
    var texHeight = 16;
    var importedImage = null;
    var drawTool = 'pen';
    var isDrawing = false;
    var startX = 0;
    var startY = 0;
    var snapshotData = null;

    var frames = new Array();
    var currentFrameIndex = 0;

    function switchTab(tabName) {
      var controlsPanel = document.getElementById('panel-controls');
      var outputPanel = document.getElementById('panel-output');
      var btnControls = document.getElementById('tab-btn-controls');
      var btnOutput = document.getElementById('tab-btn-output');

      if (tabName === 'controls') {
        controlsPanel.classList.add('active-tab');
        outputPanel.classList.remove('active-tab');
        btnControls.classList.add('active');
        btnOutput.classList.remove('active');
      } else {
        controlsPanel.classList.remove('active-tab');
        outputPanel.classList.add('active-tab');
        btnControls.classList.remove('active');
        btnOutput.classList.add('active');
      }
    }

    var pixelCanvas = document.getElementById('pixelCanvas');
    var pCtx = pixelCanvas.getContext('2d');

    function createFrameCanvas(res) {
      var c = document.createElement('canvas');
      c.width = res;
      c.height = res;
      return c;
    }

    function saveCurrentFrame() {
      if (frames.length === 0) return;
      var target = frames.slice(currentFrameIndex, currentFrameIndex + 1).pop();
      var tCtx = target.getContext('2d');
      tCtx.clearRect(0, 0, target.width, target.height);
      tCtx.drawImage(pixelCanvas, 0, 0);
    }

    function loadFrameToCanvas(idx) {
      if (frames.length === 0) return;
      currentFrameIndex = idx;
      var target = frames.slice(currentFrameIndex, currentFrameIndex + 1).pop();
      pixelCanvas.width = target.width;
      pixelCanvas.height = target.height;
      pCtx.clearRect(0, 0, pixelCanvas.width, pixelCanvas.height);
      pCtx.imageSmoothingEnabled = false;
      pCtx.drawImage(target, 0, 0);
      updateFrameUI();
    }

    function updateFrameUI() {
      document.getElementById('frame-label').textContent = 'コマ: ' + (currentFrameIndex + 1) + ' / ' + frames.length;
      var mode = document.getElementById('textureMode').value;
      if (mode === 'draw') {
        var res = Number(document.getElementById('canvasResolution').value);
        texWidth = res;
        texHeight = res * Math.max(1, frames.length);
      }
      updateAll();
    }

    function prevFrame() {
      if (frames.length <= 1) return;
      saveCurrentFrame();
      var nextIdx = (currentFrameIndex - 1 + frames.length) % frames.length;
      loadFrameToCanvas(nextIdx);
    }

    function nextFrame() {
      if (frames.length <= 1) return;
      saveCurrentFrame();
      var nextIdx = (currentFrameIndex + 1) % frames.length;
      loadFrameToCanvas(nextIdx);
    }

    function addFrame() {
      saveCurrentFrame();
      var res = Number(document.getElementById('canvasResolution').value);
      var newC = createFrameCanvas(res);
      newC.getContext('2d').drawImage(pixelCanvas, 0, 0);
      frames.splice(currentFrameIndex + 1, 0, newC);
      loadFrameToCanvas(currentFrameIndex + 1);
      showToast('コマを複製しました (' + frames.length + 'コマ)');
    }

    function deleteFrame() {
      if (frames.length <= 1) {
        showToast('1コマだけの時は削除できません');
        return;
      }
      frames.splice(currentFrameIndex, 1);
      var nextIdx = Math.min(currentFrameIndex, frames.length - 1);
      loadFrameToCanvas(nextIdx);
      showToast('コマを削除しました');
    }

    function initDefaultStar() {
      var res = Number(document.getElementById('canvasResolution').value);
      var c = createFrameCanvas(res);
      var cCtx = c.getContext('2d');
      cCtx.fillStyle = '#ffffff';
      var mid = Math.floor(res / 2);
      var r = Math.max(1, Math.floor(res / 8));
      cCtx.fillRect(mid - r, mid - r * 3, r * 2, r * 6);
      cCtx.fillRect(mid - r * 3, mid - r, r * 6, r * 2);
      frames = new Array(c);
      loadFrameToCanvas(0);
    }

    function changeTextureMode() {
      var mode = document.getElementById('textureMode').value;
      document.getElementById('mode-draw-box').style.display = (mode === 'draw') ? 'block' : 'none';
      document.getElementById('mode-import-box').style.display = (mode === 'import') ? 'block' : 'none';

      if (mode === 'draw') {
        var res = Number(document.getElementById('canvasResolution').value);
        texWidth = res;
        texHeight = res * Math.max(1, frames.length);
      } else if (mode === 'import' && importedImage) {
        texWidth = importedImage.width;
        texHeight = importedImage.height;
      } else {
        texWidth = 16;
        texHeight = 16;
      }
      updateAll();
    }

    function updateImportFrames() {
      var count = Number(document.getElementById('importFrames').value);
      document.getElementById('val-importFrames').textContent = (count === 1) ? '1 コマ (静止画)' : count + ' コマ (アニメ)';
      updateAll();
    }

    function changeResolution() {
      saveCurrentFrame();
      var res = Number(document.getElementById('canvasResolution').value);
      for (var i = 0; i < frames.length; i++) {
        var oldC = frames.slice(i, i + 1).pop();
        var newC = createFrameCanvas(res);
        var nCtx = newC.getContext('2d');
        nCtx.imageSmoothingEnabled = false;
        nCtx.drawImage(oldC, 0, 0, res, res);
        frames.splice(i, 1, newC);
      }
      loadFrameToCanvas(currentFrameIndex);
    }

    function setDrawTool(tool) {
      drawTool = tool;

    function clearPixelCanvas() {

    function getCanvasCoords(e) {
      var rect = pixelCanvas.getBoundingClientRect();
      var touch = (e.touches && e.touches.length > 0) ? e.touches.item(0) : null;
      var clientX = touch ? touch.clientX : e.clientX;
      var clientY = touch ? touch.clientY : e.clientY;
      var x = Math.floor(((clientX - rect.left) / rect.width) * pixelCanvas.width);
      var y = Math.floor(((clientY - rect.top) / rect.height) * pixelCanvas.height);
      return { x: x, y: y };
    }

    function hexToRgbaBytes(hex) {
      return new Array(
        parseInt(hex.slice(1, 3), 16),
        parseInt(hex.slice(3, 5), 16),
        parseInt(hex.slice(5, 7), 16),
        255
      );
    }

    function floodFill(startX, startY, fillHex) {
      var w = pixelCanvas.width;
      var h = pixelCanvas.height;
      if (startX < 0 || startX >= w || startY < 0 || startY >= h) return;

      var imgData = pCtx.getImageData(0, 0, w, h);
      var data = imgData.data;
      var idx = (startY * w + startX) * 4;
      var targetR = data[idx];
      var targetG = data[idx + 1];
      var targetB = data[idx + 2];
      var targetA = data[idx + 3];

      var fillBytes = hexToRgbaBytes(fillHex);
      var fillR = fillBytes[0];
      var fillG = fillBytes[1];
      var fillB = fillBytes[2];
      var fillA = fillBytes[3];

      if (targetR === fillR && targetG === fillG && targetB === fillB && targetA === fillA) return;

      var stack = new Array(new Array(startX, startY));
      var visited = new Uint8Array(w * h);

      while (stack.length > 0) {
        var pt = stack.pop();
        var cx = pt[0];
        var cy = pt[1];
        if (cx < 0 || cx >= w || cy < 0 || cy >= h) continue;
        var pos = cy * w + cx;
        if (visited[pos]) continue;

        var pIdx = pos * 4;
        if (
          data[pIdx] === targetR &&
          data[pIdx + 1] === targetG &&
          data[pIdx + 2] === targetB &&
          data[pIdx + 3] === targetA
        ) {
          visited[pos] = 1;
          data[pIdx] = fillR;
          data[pIdx + 1] = fillG;
          data[pIdx + 2] = fillB;
          data[pIdx + 3] = fillA;

          stack.push(new Array(cx + 1, cy));
          stack.push(new Array(cx - 1, cy));
          stack.push(new Array(cx, cy + 1));
          stack.push(new Array(cx, cy - 1));
        }
      }
      pCtx.putImageData(imgData, 0, 0);
    }


    function drawPixelLine(x0, y0, x1, y1, size, color) {
      var offset = Math.floor(size / 2);
      pCtx.fillStyle = color;
      var dx = Math.abs(x1 - x0);
      var dy = Math.abs(y1 - y0);
      var sx = (x0 < x1) ? 1 : -1;
      var sy = (y0 < y1) ? 1 : -1;
      var err = dx - dy;

      while (true) {
        pCtx.fillRect(x0 - offset, y0 - offset, size, size);
        if (x0 === x1 && y0 === y1) break;
        var e2 = 2 * err;
        if (e2 > -dy) { err -= dy; x0 += sx; }
        if (e2 < dx) { err += dx; y0 += sy; }
      }
    }

    function drawPixelCircle(x0, y0, x1, y1, size, color) {
      var offset = Math.floor(size / 2);
      pCtx.fillStyle = color;
      var r = Math.round(Math.sqrt(Math.pow(x1 - x0, 2) + Math.pow(y1 - y0, 2)));
      var steps = Math.max(16, r * 8);
      for (var i = 0; i < steps; i++) {
        var theta = (i / steps) * Math.PI * 2;
        var px = Math.round(x0 + Math.cos(theta) * r);
        var py = Math.round(y0 + Math.sin(theta) * r);
        pCtx.fillRect(px - offset, py - offset, size, size);
      }
    }

    function handleStartDraw(e) {
      if (e.cancelable) e.preventDefault();
      var pos = getCanvasCoords(e);
      var color = document.getElementById('drawColor').value;

      if (drawTool === 'fill') {
        floodFill(pos.x, pos.y, color);
        saveCurrentFrame();
        return;
      }

      isDrawing = true;
      startX = pos.x;
      startY = pos.y;

      if (drawTool === 'line' || drawTool === 'circle') {
        snapshotData = pCtx.getImageData(0, 0, pixelCanvas.width, pixelCanvas.height);
      } else {
        drawAt(e);
      }
    }

    function drawAt(e) {
      if (!isDrawing) return;
      if (e.cancelable) e.preventDefault();
      var pos = getCanvasCoords(e);
      var size = Number(document.getElementById('brushSize').value);
      var offset = Math.floor(size / 2);
      var color = document.getElementById('drawColor').value;

      if (drawTool === 'pen') {
        pCtx.fillStyle = color;
        pCtx.fillRect(pos.x - offset, pos.y - offset, size, size);
      } else if (drawTool === 'eraser') {
        pCtx.clearRect(pos.x - offset, pos.y - offset, size, size);
      } else if (drawTool === 'line' && snapshotData) {
        pCtx.putImageData(snapshotData, 0, 0);
        drawPixelLine(startX, startY, pos.x, pos.y, size, color);
      } else if (drawTool === 'circle' && snapshotData) {
        pCtx.putImageData(snapshotData, 0, 0);
        drawPixelCircle(startX, startY, pos.x, pos.y, size, color);
      }
    }

    function handleEndDraw() {

      isDrawing = false;
      snapshotData = null;

    function hexToRgbaArray(hex, alpha) {
      if (alpha === undefined) alpha = 1.0;

      var g = parseInt(hex.slice(3, 5), 16) / 255;
      var b = parseInt(hex.slice(5, 7), 16) / 255;
      return new Array(

        Number(b.toFixed(3)),

      );
    }

    function rgbaArrayToHex(arr) {
      if (!Array.isArray(arr) || arr.length < 3) return '#ffffff';
      var toHex = function(v) {
        return Math.max(0, Math.min(255, Math.round(v * 255))).toString(16).padStart(2, '0');
      };
      var rHex = toHex(arr.slice(0, 1).pop());
      var gHex = toHex(arr.slice(1, 2).pop());
      var bHex = toHex(arr.slice(2, 3).pop());
      return '#' + rHex + gHex + bHex;
    }

    function hexToRgb(hex) {
      return {

    function loadParticleJSON(event) {
      var file = event.target.files.item(0);
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var rawText = e.target.result;
          var cleanText = rawText.replace(/\/\*[\s\S]*?\*\/|([^\\:]|^)\/\/.*$/gm, '$1');
          var data = JSON.parse(cleanText);
          var effect = data.particle_effect;
          if (!effect) throw new Error('Invalid format');

          var desc = effect.description || {};
          if (desc.identifier) elements.identifier.value = desc.identifier;
          var params = desc.basic_render_parameters || {};
          if (params.texture) elements.texture.value = params.texture;
          if (params.material) elements.material.value = params.material;

          var comp = effect.components || {};
          if (comp['minecraft:emitter_rate_steady']) {
            var rateVal = Number(comp['minecraft:emitter_rate_steady'].spawn_rate);
            var maxVal = Number(comp['minecraft:emitter_rate_steady'].max_particles);
            if (!isNaN(rateVal)) elements.rate.value = rateVal;
            if (!isNaN(maxVal)) elements.maxParticles.value = maxVal;
          }
          if (comp['minecraft:emitter_shape_sphere']) {
            var radVal = Number(comp['minecraft:emitter_shape_sphere'].radius);
            if (!isNaN(radVal)) elements.spread.value = radVal;
          }
          if (comp['minecraft:particle_lifetime_expression']) {
            var lifeVal = Number(comp['minecraft:particle_lifetime_expression'].max_lifetime);
            if (!isNaN(lifeVal)) elements.lifetime.value = lifeVal;
          }
          if (comp['minecraft:particle_initial_speed'] !== undefined) {
            var spdVal = Number(comp['minecraft:particle_initial_speed']);
            if (!isNaN(spdVal)) elements.speed.value = spdVal;
          }
          if (comp['minecraft:particle_motion_dynamic'] && Array.isArray(comp['minecraft:particle_motion_dynamic'].linear_acceleration)) {
            var acc = comp['minecraft:particle_motion_dynamic'].linear_acceleration;
            var gravVal = Number(acc.slice(1, 2).pop());
            if (!isNaN(gravVal)) elements.gravity.value = gravVal;
          }
          if (comp['minecraft:particle_appearance_billboard']) {
            var bb = comp['minecraft:particle_appearance_billboard'];
            if (Array.isArray(bb.size)) {
              var szVal = Number(bb.size.slice(0, 1).pop());
              if (!isNaN(szVal)) elements.size.value = szVal;
            }
            if (bb.uv && bb.uv.texture_width) {
              texWidth = Number(bb.uv.texture_width) || 16;
              texHeight = Number(bb.uv.texture_height) || texWidth;
            }
            if (bb.uv && bb.uv.flipbook && bb.uv.flipbook.max_frame) {
              document.getElementById('importFrames').value = Number(bb.uv.flipbook.max_frame) || 1;
              updateImportFrames();
            }
          }
          if (comp['minecraft:particle_appearance_tinting'] && comp['minecraft:particle_appearance_tinting'].color) {
            var grad = comp['minecraft:particle_appearance_tinting'].color.gradient;
            var hex0 = (grad && grad['0.0']) ? rgbaArrayToHex(grad['0.0']) : '#ffffff';
            var hex1 = (grad && grad['1.0']) ? rgbaArrayToHex(grad['1.0']) : '#ffffff';
            if (hex0 === '#ffffff' && hex1 === '#ffffff') {

              elements.colorEnd.value = hex1;

            }
          } else {

          }

          toggleColorMode();
          showToast('JSONを読み込みました！');

    function Particle(centerX, centerY) {
      var spreadPx = Number(elements.spread.value) * 35;
      var angle = Math.random() * Math.PI * 2;
      var dist = Math.random() * spreadPx;

      this.x = centerX + Math.cos(angle) * dist;
      this.y = centerY + Math.sin(angle) * dist;

      var speedPx = Number(elements.speed.value) * 35;
      this.vx = Math.cos(angle) * speedPx;
      this.vy = Math.sin(angle) * speedPx;

      this.age = 0;
      this.lifetime = Number(elements.lifetime.value);
    }

    Particle.prototype.update = function(dt) {
      this.age += dt;
      var gravityPx = -Number(elements.gravity.value) * 35;
      this.vy += gravityPx * dt;

      this.x += this.vx * dt;
      this.y += this.vy * dt;
    };

    Particle.prototype.draw = function(ctx) {
      var progress = Math.min(this.age / this.lifetime, 0.9999);
      var isOriginal = (elements.colorMode.value === 'original');
      var c1 = hexToRgb(elements.colorStart.value);
      var c2 = hexToRgb(elements.colorEnd.value);

      var r = isOriginal ? 255 : Math.round(c1.r + (c2.r - c1.r) * progress);
      var g = isOriginal ? 255 : Math.round(c1.g + (c2.g - c1.g) * progress);
      var b = isOriginal ? 255 : Math.round(c1.b + (c2.b - c1.b) * progress);
      var alpha = elements.fadeOut.value === 'true' ? (1.0 - progress) : 1.0;

      var sizePx = Math.max(2, Number(elements.size.value) * 35);
      var mode = document.getElementById('textureMode').value;

      var sourceImg = null;
      var sx = 0;
      var sy = 0;
      var sw = 0;
      var sh = 0;

      if (mode === 'draw') {
        var totalFrames = Math.max(1, frames.length);
        var fIdx = Math.min(totalFrames - 1, Math.floor(progress * totalFrames));
        sourceImg = (fIdx === currentFrameIndex) ? pixelCanvas : frames.slice(fIdx, fIdx + 1).pop();
        if (sourceImg) {
          sw = sourceImg.width;
          sh = sourceImg.height;
        }
      } else if (mode === 'import' && importedImage) {
        sourceImg = importedImage;
        var impFrames = Math.max(1, Number(document.getElementById('importFrames').value) || 1);
        var fIdxImp = Math.min(impFrames - 1, Math.floor(progress * impFrames));
        sw = importedImage.width;
        sh = Math.max(1, Math.floor(importedImage.height / impFrames));
        sy = fIdxImp * sh;
      }

      if (sourceImg && sw > 0 && sh > 0) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.imageSmoothingEnabled = (mode === 'import');

        if (isOriginal) {
          ctx.drawImage(sourceImg, sx, sy, sw, sh, this.x - sizePx / 2, this.y - sizePx / 2, sizePx, sizePx);
        } else {
          tintCanvas.width = sw;
          tintCanvas.height = sh;
          tintCtx.clearRect(0, 0, sw, sh);
          tintCtx.drawImage(sourceImg, sx, sy, sw, sh, 0, 0, sw, sh);

          tintCtx.globalCompositeOperation = 'multiply';
          tintCtx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
          tintCtx.fillRect(0, 0, sw, sh);

          tintCtx.globalCompositeOperation = 'destination-in';
          tintCtx.drawImage(sourceImg, sx, sy, sw, sh, 0, 0, sw, sh);
          tintCtx.globalCompositeOperation = 'source-over';

          ctx.drawImage(tintCanvas, 0, 0, sw, sh, this.x - sizePx / 2, this.y - sizePx / 2, sizePx, sizePx);
        }
        ctx.restore();
      } else {
        ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
        ctx.fillRect(this.x - sizePx / 2, this.y - sizePx / 2, sizePx, sizePx);
      }
    };

    function animate(now) {
      var dt = (now - lastTime) / 1000;
      lastTime = now;

      ctx.fillStyle = '#121212';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      var centerX = canvas.width / 2;
      var centerY = canvas.height / 2;

      ctx.strokeStyle = '#2a2a2a';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(centerX, 0);
      ctx.lineTo(centerX, canvas.height);
      ctx.moveTo(0, centerY);
      ctx.lineTo(canvas.width, centerY);
      ctx.stroke();

      var rate = Number(elements.rate.value);
      var maxP = Number(elements.maxParticles.value);
      spawnAccumulator += rate * dt;

      while (spawnAccumulator >= 1) {
        if (particles.length < maxP) {
          particles.push(new Particle(centerX, centerY));
        }
        spawnAccumulator -= 1;
      }

      if (elements.material.value === 'particles_add') {
        ctx.globalCompositeOperation = 'lighter';
      } else {
        ctx.globalCompositeOperation = 'source-over';
      }

      for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles.slice(i, i + 1).pop();
        p.update(dt);
        if (p.age >= p.lifetime) {
          particles.splice(i, 1);
        } else {
          p.draw(ctx);
        }
      }

      ctx.globalCompositeOperation = 'source-over';
      document.getElementById('particle-count').textContent = '表示中: ' + particles.length;

      requestAnimationFrame(animate);
    }

    initDefaultStar();
    toggleColorMode();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
